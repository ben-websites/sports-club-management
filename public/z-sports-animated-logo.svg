<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Z Sports multi-sport logo</title>
  <desc id="desc">A bold orange letter Z with four sports illustrations integrated into its four corners.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad42"/>
      <stop offset=".52" stop-color="#ff7417"/>
      <stop offset="1" stop-color="#e84b08"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2df" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff2df" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="zclip">
      <path d="M112 132 H488 V224 L237 376 H488 V468 H112 V376 L363 224 H112 Z"/>
    </clipPath>
    <style>
      @keyframes zFlip {
        0%, 72% { transform: perspective(900px) rotateY(0deg) scale(1); }
        78% { transform: perspective(900px) rotateY(90deg) scale(.96); }
        86% { transform: perspective(900px) rotateY(180deg) scale(1.02); }
        94%, 100% { transform: perspective(900px) rotateY(360deg) scale(1); }
      }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%,100% { opacity:.55; }
        50% { opacity:1; }
      }
      .z-main { transform-origin:300px 300px; animation:zFlip 5s cubic-bezier(.45,.05,.55,.95) infinite; }
      .orbit { transform-origin:300px 300px; animation:orbit 22s linear infinite; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .z-main,.orbit,.pulse { animation:none; }
      }
    </style>
  </defs>

  <circle cx="300" cy="290" r="238" fill="#f97316" opacity=".055"/>
  <g class="orbit" fill="none" stroke="#f97316" opacity=".42">
    <circle cx="300" cy="300" r="252" stroke-width="2" stroke-dasharray="46 18 8 26"/>
    <path d="M300 38v16 M300 546v16 M38 300h16 M546 300h16" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The Z is the emblem: all sport references are built into its strokes. -->
  <g class="z-main">
    <path d="M112 132 H488 V224 L237 376 H488 V468 H112 V376 L363 224 H112 Z"
          fill="url(#orange)" stroke="#ffb36b" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Clean highlight edges keep the Z readable at small sizes -->
    <path d="M132 151 H465" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M132 448 H465" stroke="#ffd4ad" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <!-- Small speed cuts in the diagonal, not separate icons -->
    <path d="M269 317l-31 19 M291 330l-31 19" stroke="#fff0df" stroke-width="5" stroke-linecap="round" opacity=".72"/>
  </g>



  <!-- Minimal, consistent sports marks in four corner medallions -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Cricket bat and ball: upper-left -->
    <g transform="translate(175 178)">
      <circle r="27" fill="#111216" stroke="#9b4b17" stroke-width="2"/>
      <g transform="rotate(-35)" fill="none" stroke="#ffc17e" stroke-width="3.5">
        <path d="M-5 -18 Q-10 -18 -10 -11 V12 Q-10 18 -4 18 H4 Q10 18 10 12 V-11 Q10 -18 5 -18 Z" fill="#f59a3b" stroke="#ffc17e"/>
        <path d="M-4 18 V24 Q-4 27 0 27 Q4 27 4 24 V18" />
        <path d="M-6 -9 H6" stroke="#b85b16" stroke-width="2"/>
      </g>
      <circle cx="17" cy="-16" r="4" fill="#ff8b32" stroke="#ffe0bd" stroke-width="1.5"/>
    </g>

    <!-- Association football / soccer ball: upper-right -->
    <g transform="translate(425 178)">
      <circle r="27" fill="#111216" stroke="#9b4b17" stroke-width="2"/>
      <circle r="18" fill="none" stroke="#ffc17e" stroke-width="3"/>
      <path d="M0 -8 L7 -3 L4 6 H-4 L-7 -3 Z" fill="#f97316" stroke="#ffc17e" stroke-width="2"/>
      <path d="M0 -8 L0 -17 M7 -3 L16 -7 M4 6 L10 14 M-4 6 L-10 14 M-7 -3 L-16 -7 M0 0 L0 17" fill="none" stroke="#ffc17e" stroke-width="2.2"/>
    </g>

    <!-- Badminton racket and shuttlecock: lower-left -->
    <g transform="translate(175 422)">
      <circle r="27" fill="#111216" stroke="#9b4b17" stroke-width="2"/>
      <g transform="rotate(-35)" fill="none" stroke="#ffc17e" stroke-width="2.6">
        <ellipse cx="-2" cy="-7" rx="10" ry="14"/>
        <path d="M-2 -21 V7 M-12 -7 H8 M-9 -17 L5 3 M5 -17 L-9 3" stroke-width="1.5"/>
        <path d="M-2 7 L-2 23" stroke-width="4"/>
      </g>
      <g transform="translate(13 -10) rotate(35)" fill="none" stroke="#fff0df" stroke-width="2.2">
        <path d="M-7 -8 L7 -8 L4 5 H-4 Z"/>
        <path d="M-7 -8 L-12 -17 M-2 -8 L-2 -18 M3 -8 L8 -17"/>
        <path d="M-4 5 Q0 10 4 5" stroke="#ff8b32"/>
      </g>
    </g>

    <!-- Baseball bat and stitched ball: lower-right -->
    <g transform="translate(425 422)">
      <circle r="27" fill="#111216" stroke="#9b4b17" stroke-width="2"/>
      <g transform="rotate(38)" fill="none" stroke="#ffc17e" stroke-width="3">
        <path d="M-3 -22 Q-8 -22 -8 -16 L-5 9 Q-4 14 0 14 Q4 14 5 9 L8 -16 Q8 -22 3 -22 Z" fill="#b87539"/>
        <path d="M-5 14 L-5 22 M5 14 L5 22" stroke="#fff0df" stroke-width="2"/>
      </g>
      <circle cx="13" cy="13" r="9" fill="#fffaf2" stroke="#ffc17e" stroke-width="1.5"/>
      <path d="M8 6 Q17 12 18 20 M18 6 Q9 12 8 20" fill="none" stroke="#e85a22" stroke-width="1.8"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="300" y="535" fill="#fff" font-size="48" font-weight="900" letter-spacing="13">SPORTS</text>
    <path d="M185 552 H415" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <text x="300" y="578" fill="#a1a1aa" font-size="12" font-weight="700" letter-spacing="5">PLAY • COMPETE • WIN</text>
  </g>
</svg>
