<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sports-hub-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffa100" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Sports Hub - a connected sports club management platform for memberships, fee vouchers, arenas and tournaments." />
    <title>Sports Hub | Club Management System</title>
    <script>
      // Paint the saved colour scheme before React mounts (no white/dark flash).
      (function () {
        try {
          if (localStorage.getItem("scms-theme") === "light") {
            document.documentElement.classList.add("theme-light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0c0c0e] text-zinc-100 antialiased selection:bg-orange-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
